<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
<title> title </title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="/resources/cdn-main/example.css">
<script src="/resources/cdn-main/example.js"></script>
<style>
 span.material-symbols-outlined{
    vertical-align: text-bottom;
 }   
</style>
<style>    
 .pagination li{
   display: inline-block;
 }
 .pagination li.active a{
   color: red;
 }
  .pagination a{
   border: none;
   padding: 0;
 } 
</style>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Gyur HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code"> 
       guestbook/list.html
  </xmp>
 <h1> 
 GuestBook List Page
 
 <span style="float: right;">
 	<a th:href="@{/guestbook/register}">
 		<button type="button">Register </button>
 	</a>
 </span>
 </h1>
 <table style="width:100%">
 	<thead>
 		<tr>
 			<th>#</th>
 			<th>Title</th>
 			<th>Writer</th>
 			<th>Regdate</th>
 		
 		</tr>
 	
 	</thead>
 	<tbody>
 		<tr th:if="${#lists.isEmpty(result.dtoList)}">
 			<td colspan = "4">
 				방명록 글이 존재하지 x
 			</td>
 		</tr>
 		<tr th:each="dto : ${result.dtoList}">
 			<th>[[${dto.gno}]]</th>
 			<td>
 			<!-- /guestbook/read?gno=300&page=3&size=10&검색조건,검색어... -->
 			<a th:href="@{/guestbook/read(gno=${dto.gno},page=${result.page},size=${result.size})}">[[${dto.title}]]</a>
 			
 			</td>
 			<td>[[${dto.writer}]]</td>
 			<td>[[${ #temporals.format(dto.regDate, 'yyyy/MM/dd')}]]</td>
 		</tr>
 	
 	</tbody>
 	<tfoot>
 		<tr>
 			<td colspan="4" style="text-align: center;">
 			<ul class="pagination">
 				<li th:if="${result.prev}">
 					<a th:href="@{/guestbook/list(page=${result.start-1})}">Prev</a>
 				</li>
 				
 				<li th:each="page : ${result.pageList}"
 					th:class="'page-item ' + ${result.page== page ? 'active': ''}"
 				>
 					<a th:href="@{/guestbook/list(page=${page})}">[[${page}]]</a>
 				</li>
 				
 				<li th:if="${result.next}">
 					<a th:href="@{/guestbook/list(page=${result.end+1})}">Next</a>
 				</li>
 			</ul>
 			<!-- 1 2 3 4 5 6 -->
 			</td>
 		</tr>
 	</tfoot>
 </table>
</div>

<script th:inline="javascript">
	var msg = [[${msg}]];
	console.log(msg);
	if(msg){
		alert("[모달창]" + msg + "번 등록/삭제!!");
	}
</script>
</body>
</html>
