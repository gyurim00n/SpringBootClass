<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/city/layout}">
<head>
    <title>Index</title>
</head>
<body>

<main layout:fragment="content">
     
    <h1>HOme 세계의 도시</h1>
    <p>이미지를 클릭하여 도시를 둘러보세요.</p>

    <div class="city-container">

        <!-- London -->
        <a th:href="@{/city/london}" class="city-card">
            <img
                src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=600&q=80"
                alt="London">
            <h2>London</h2>
        </a>

        <!-- Paris -->
        <a th:href="@{/city/paris}" class="city-card">
            <img
                src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=600&q=80"
                alt="Paris">
            <h2>Paris</h2>
        </a>

        <!-- Seoul -->
        <a th:href="@{/city/seoul}" class="city-card">
            <img
                src="https://images.unsplash.com/photo-1546874177-9e664107314e?auto=format&fit=crop&w=600&q=80"
                alt="Seoul">
            <h2>Seoul</h2>
        </a>

    </div>
         
        
        
</main>

</body>
</html>
