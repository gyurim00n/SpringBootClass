 }

  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Gyur HOme</a></h1>

<div>
  <xmp class="code"> 
       member.html
  </xmp>
 <h1>For Member</h1>
 <!--Thymeleaf 를 이용한 사용자정보 출력  -->
 
 <div sec:authorize="hasRole('USER')"> HAS USER ROLE </div>
 <div sec:authorize="hasRole('MANAGER')"> HAS MANAGER ROLE </div>
 <div sec:authorize="hasRole('ADMIN')"> HAS ADMIN ROLE </div>
 
 <br>
 <div sec:authorize = "isAuthenticated()">
 	Only Authenticated user can see this Text.
 </div><br>
 Authenticated username : <div sec:authorication="name"> </div>
 Autehnticated user roles: 
 <div sec:authorication="principal.authorities"> </div>
 
 
 <a th:href="@{/}"> home </a>
</div>
</body>
