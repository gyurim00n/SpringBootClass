<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>블로그 글 목록</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
  <div class="p-5 mb-5 text-center">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
  </div>
  <div class="container mt-5">
     <div class="row">
       <div class="col-lg-8">
         <article>
           <!-- 블로그 글 id 추가 -->
           <input type="hidden" id="article-id" th:value="${article.id}">
                    
           <header class="mb-4">
             <h1 class="fw-bolder mb-1" th:text="${article.title}"></h1>
            <div class="text-muted fst-italic mb-2" th:text="|Posted on ${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}|"></div>
           </header>                 
           <section class="mb-5">
             <p class="fs-5 mb-4" th:text="${article.content}"></p>
           </section>
           <button type="button"
			        id="modify-btn"
			        th:onclick="|location.href='@{/blog/new-article?id={articleId}(articleId=${article.id})}'|"
			        class="btn btn-primary btn-sm">
			    수정
			</button>
           <button type="button" class="btn btn-secondary btn-sm" id="delete-btn">삭제</button>
           <button type="button" class="btn btn-secondary btn-sm" id="select-btn" th:onclick="|location.href='@{/blog/articles}'|">목록</button>
         </article>
       </div>
     </div>
  </div>
  
<script th:src="@{/blog_js/article.js}"></script>

</body>
</html>
