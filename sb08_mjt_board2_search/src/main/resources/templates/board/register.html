<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
<title>title</title>
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="/resources/cdn-main/example.css">
<script src="/resources/cdn-main/example.js"></script>
<style>
span.material-symbols-outlined {
	vertical-align: text-bottom;
}
</style>
</head>
<body>
	<header>
		<h1 class="main">
			<a href="#" style="position: absolute; top: 30px;">Gyur HOme</a>
		</h1>
		<ul>
			<li><a href="#">로그인</a></li>
			<li><a href="#">회원가입</a></li>
		</ul>
	</header>
	<div>
		<xmp class="code"> /board/register.html </xmp>
		<h1>BOARD REGISTER PAGE</h1>

		<form th:action="@{/board/register}" method="post">
			<table>
				<tr>
					<th><label for="title">Title</label></th>
					<td><input type="text" id="title" name="title"
						placeholder="Enter Title" class="full"></td>
				</tr>

				<tr>
					<th><label for="content">Content</label></th>
					<td><textarea id="content" rows="5" name="content"
							class="full"></textarea></td>
				</tr>

				<tr>
					<th><label for="writerEmail">Writer Email</label></th>
					<td><input type="email" id="writerEmail" name="writerEmail"
						placeholder="Enter Writer Email" class="long"></td>
				</tr>

				<tr>
					<td colspan="2" align="center">
						<button type="submit">Submit</button>
					</td>
				</tr>
			</table>
		</form>
	</div>
</body>
</html>
